<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasky Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #4F46E5;
    --bg: #FFFFFF;
    --surface: #F5F6F8;
    --border: #E5E7EB;
    --text: #111827;
    --text-2: #6B7280;
    --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px; --s5: 40px; --s6: 48px;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--surface); font-family: 'Inter', system-ui, sans-serif; color: var(--text);
    overflow: hidden;
  }
  .stage { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(var(--scale, 1)); }
  .phone {
    width: 402px; height: 874px; background: var(--bg); border-radius: 64px;
    border: 10px solid var(--text); box-sizing: content-box; position: relative; overflow: hidden;
    display: flex; flex-direction: column; flex-shrink: 0;
    box-shadow: 0 0 0 2px #6B7280, 0 24px 48px rgba(17,24,39,.25);
  }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; border-radius: 20px; background: #000; z-index: 10; }
  .indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--text); z-index: 10; }
  header { padding: 72px var(--s3) var(--s2); }
  header p { font-size: 14px; color: var(--text-2); }
  h1 { font-size: 24px; font-weight: 600; margin-top: var(--s1); }
  main { flex: 1; overflow-y: auto; padding: 0 var(--s3) 96px; }
  h2 { font-size: 14px; font-weight: 600; color: var(--text-2); margin: var(--s3) 0 var(--s1); }
  ul { list-style: none; padding: 0; }
  li {
    display: flex; align-items: center; gap: var(--s2); min-height: 56px;
    padding: var(--s1) 0; border-bottom: 1px solid var(--border);
  }
  li .label { flex: 1; font-size: 16px; }
  li.done .label { text-decoration: line-through; color: var(--text-2); }
  .check {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border);
    background: none; cursor: pointer; flex-shrink: 0; display: grid; place-items: center; padding: 0;
  }
  .check:hover { border-color: var(--accent); }
  li.done .check { background: var(--accent); border-color: var(--accent); }
  li.done .check::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px,-1px); }
  .del { width: 32px; height: 32px; border: 0; background: none; color: var(--text-2); cursor: pointer; border-radius: 8px; display: grid; place-items: center; }
  .del:hover { background: var(--surface); color: var(--text); }
  .fab {
    position: absolute; bottom: var(--s6); left: 50%; transform: translateX(-50%);
    width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent);
    color: #fff; font-size: 32px; line-height: 1; cursor: pointer; box-shadow: 0 8px 16px rgba(79,70,229,.3);
  }
  .empty { text-align: center; padding: var(--s6) var(--s3); color: var(--text-2); }
  .empty .icon { width: 64px; height: 64px; border-radius: 50%; background: var(--surface); margin: 0 auto var(--s2); display: grid; place-items: center; }
  .empty strong { display: block; color: var(--text); font-size: 16px; font-weight: 600; margin-bottom: var(--s1); }
  .empty span { font-size: 14px; }
  .scrim { position: absolute; inset: 0; background: rgba(17,24,39,.4); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg);
    border-radius: 24px 24px 0 0; padding: var(--s3) var(--s3) var(--s5); transform: translateY(100%); transition: transform .25s ease;
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; }
  .sheet h3 { font-size: 16px; font-weight: 600; margin-bottom: var(--s2); }
  .sheet input {
    width: 100%; height: 48px; padding: 0 var(--s2); font: inherit; font-size: 16px;
    border: 1px solid var(--border); border-radius: 8px; outline: none; background: var(--bg);
  }
  .sheet input:focus { border-color: var(--accent); }
  .row { display: flex; gap: var(--s1); margin-top: var(--s2); }
  .row button { flex: 1; height: 48px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; border: 0; }
  .cancel { background: var(--surface); color: var(--text); }
  .save { background: var(--accent); color: #fff; }
  .save:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<div class="stage" id="stage">
<div class="phone" id="phone">
  <div class="island"></div>
  <div class="indicator"></div>
  <header>
    <p>Today</p>
    <h1 id="date"></h1>
  </header>
  <main id="main"></main>
  <button class="fab" id="add" aria-label="Add task">+</button>

  <div class="scrim" id="scrim"></div>
  <form class="sheet" id="sheet">
    <h3>New task</h3>
    <input id="input" placeholder="What needs doing?" autocomplete="off">
    <div class="row">
      <button type="button" class="cancel" id="cancel">Cancel</button>
      <button type="submit" class="save" id="save" disabled>Save</button>
    </div>
  </form>
</div>
</div>

<script>
  // Scale the whole frame (874 + 20 bezel + 32 margin) to fit the window height, never upscaling.
  function fit() {
    document.getElementById("stage").style.setProperty("--scale", Math.min(1, innerHeight / (874 + 20 + 32)));
  }
  addEventListener("resize", fit); fit();
</script>
<script>
  let tasks = [
    { id: 1, text: "Finish econ problem set", done: false },
    { id: 2, text: "Reply to recruiter email", done: false },
    { id: 3, text: "Buy groceries", done: false },
    { id: 4, text: "Book dentist appointment", done: false },
  ];
  let nextId = 5;
  const $ = id => document.getElementById(id);
  const trash = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';

  $("date").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

  function item(t) {
    return `<li class="${t.done ? "done" : ""}">
      <button class="check" data-toggle="${t.id}" aria-label="Toggle done"></button>
      <span class="label">${t.text.replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}</span>
      <button class="del" data-del="${t.id}" aria-label="Delete task">${trash}</button>
    </li>`;
  }

  function render() {
    const todo = tasks.filter(t => !t.done), done = tasks.filter(t => t.done);
    let html = "";
    if (!tasks.length) {
      html = `<div class="empty"><div class="icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div><strong>All clear</strong><span>No tasks yet. Tap + to add one.</span></div>`;
    } else {
      if (todo.length) html += `<ul>${todo.map(item).join("")}</ul>`;
      else html += `<div class="empty"><strong>Nothing left to do</strong><span>Nice work. Tap + to add more.</span></div>`;
      if (done.length) html += `<h2>Completed</h2><ul>${done.map(item).join("")}</ul>`;
    }
    $("main").innerHTML = html;
  }

  $("main").addEventListener("click", e => {
    const tg = e.target.closest("[data-toggle]"), dl = e.target.closest("[data-del]");
    if (tg) { const t = tasks.find(t => t.id == tg.dataset.toggle); t.done = !t.done; }
    else if (dl) tasks = tasks.filter(t => t.id != dl.dataset.del);
    else return;
    render();
  });

  const phone = $("phone");
  const openSheet = () => { phone.classList.add("open"); setTimeout(() => $("input").focus(), 250); };
  const closeSheet = () => { phone.classList.remove("open"); $("input").value = ""; $("save").disabled = true; };
  $("add").onclick = openSheet;
  $("cancel").onclick = $("scrim").onclick = closeSheet;
  $("input").oninput = e => $("save").disabled = !e.target.value.trim();
  $("sheet").onsubmit = e => {
    e.preventDefault();
    const text = $("input").value.trim();
    if (!text) return;
    tasks.unshift({ id: nextId++, text, done: false });
    closeSheet(); render();
  };
  document.addEventListener("keydown", e => e.key === "Escape" && closeSheet());
  render();
</script>
</body>
</html>
